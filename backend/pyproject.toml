[project]
name = "atxteetimes"
version = "0.1.0"
description = "ATX Tee Times backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.104.1",
  "uvicorn[standard]==0.24.0",
  "sqlalchemy==2.0.23",
  "pydantic==2.5.0",
  "pydantic-settings==2.1.0",
  "resend==0.8.0",
  "apscheduler==3.10.4",
  "pytz==2023.3",
  "email-validator==2.1.0",
  "curl-cffi>=0.7.0",
  "beautifulsoup4>=4.12.0",
  "passlib[bcrypt]==1.7.4",
  "bcrypt==4.0.1",
  "pyjwt==2.8.0",
  # Optional fallback scraper; uncomment if curl_cffi gets Cloudflare-blocked
  # "playwright==1.40.0",
]

[tool.uv]
# creates backend/.venv by default